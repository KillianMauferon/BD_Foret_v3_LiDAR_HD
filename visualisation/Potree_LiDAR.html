<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <title>Modélisation 3D de la BD Forêt v3 à l'aide du LiDAR HD</title>

  <link rel="stylesheet" href="../build/potree/potree.css">
  <link rel="stylesheet" href="../libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../libs/openlayers3/ol.css">
  <link rel="stylesheet" href="../libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../libs/jstree/themes/mixed/style.css">
</head>
<body>
  <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../libs/spectrum/spectrum.js"></script>
  <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../libs/other/BinaryHeap.js"></script>
  <script src="../libs/tween/tween.min.js"></script>
  <script src="../libs/d3/d3.js"></script>
  <script src="../libs/proj4/proj4.js"></script>
  <script src="../libs/openlayers3/ol.js"></script>
  <script src="../libs/i18next/i18next.js"></script>
  <script src="../libs/jstree/jstree.js"></script>
  <script src="../build/potree/potree.js"></script>
  <script src="../libs/plasio/js/laslaz.js"></script>

  <div class="potree_container" style="position:absolute; inset:0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <script>
    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(5000000);
    Potree.maxNodesLoading = 10;
    viewer.setBackground("gradient");

    viewer.loadGUI(() => {
      viewer.setLanguage("fr");
      $("#menu_appearance").next().show();
      $("#menu_scene").next().show();
      viewer.toggleSidebar();
    });

    // 0. MNT Zone
    Potree.loadPointCloud("../pointclouds/MNT_25m/metadata.json", "MNT 25m de la zone d'étude", e => {
      const m = e.pointcloud.material;
      m.activeAttributeName = "rgba";
      m.size = 1.5;
      m.pointSizeType = Potree.PointSizeType.ADAPTIVE;

      viewer.scene.addPointCloud(e.pointcloud);
      e.pointcloud.visible = true;
    });

    // 1. Strate Herbacé
    Potree.loadPointCloud("../pointclouds/strate_herbace/metadata.json", "Strate Herbacé", e => {
      const m = e.pointcloud.material;
      m.activeAttributeName = "rgba";
      m.size = 0.75;
      m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      m.shape = Potree.PointShape.CIRCLE;

      viewer.scene.addPointCloud(e.pointcloud);
      e.pointcloud.visible = true;
    });

    // 2. Strate Arbustive
    Potree.loadPointCloud("../pointclouds/strate_arbustive/metadata.json", "Strate Arbustive", e => {
      const m = e.pointcloud.material;
      m.activeAttributeName = "rgba";
      m.size = 0.75;
      m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      m.shape = Potree.PointShape.CIRCLE;

      viewer.scene.addPointCloud(e.pointcloud);
      e.pointcloud.visible = true;
    });

    // 3. Strate Arborée avec essence
    const noms = [
      "Aulne",
      "Autre conifère que pin ou mélange de conifères autres que pins",
      "Autre feuillu ou mélange de feuillus",
      "Autre mélange de feuillus-conifères",
      "Autre pin ou mélange de pins",
      "Bouleau", "Charme", "Châtaignier", "Chênaie-charmaie", "Chênaie-frênaie",
      "Chênaie-hêtraie", "Chênaie-pineraie", "Chênes décidus", "Douglas", "Epicéa",
      "Essence indéterminée", "Frêne", "Hêtraie-sapinière", "Hêtre",
      "Mélange de chênes décidus et sempervirents", "Mélange de pins-conifères",
      "Mélèze", "Peuplier", "Pin laricio, pin noir", "Pin sylvestre", "Robinier",
      "Sapin", "Sapinière-pessière", "Saule"
    ];

    const couleurs = [
      "#28ffa7", "#59ffff", "#afca59", "#ff6633", "#a666ff", "#a3ff73",
      "#aef1b0", "#40ff26", "#7eb87f", "#a9b67b", "#5ba55d", "#f8c350",
      "#004d2e", "#d399ff", "#4bc2e7", "#a6a6a6", "#c19a67", "#e8863c",
      "#00ff80", "#50693f", "#b1a3eb", "#4d80ff", "#ffff00", "#4d33ff",
      "#9926ff", "#915633", "#1bbbbf", "#1ae6e6", "#66ffcc"
    ];

    const hex2rgb = h => [
      parseInt(h.slice(1, 3), 16) / 255,
      parseInt(h.slice(3, 5), 16) / 255,
      parseInt(h.slice(5, 7), 16) / 255
    ];

    Potree.loadPointCloud("../pointclouds/strate_arboree/metadata.json", "Strate Arborée avec essence", e => {
      const pc = e.pointcloud;
      const m = pc.material;

      const classification = {};
      noms.forEach((nom, i) => {
        const c = hex2rgb(couleurs[i]);
        classification[i + 1] = { visible: true, name: nom, color: [c[0], c[1], c[2], 1] };
      });
      classification.DEFAULT = { visible: true, name: "Autre", color: [0.3, 0.3, 0.3, 1] };

      viewer.scene.addPointCloud(pc);

      m.activeAttributeName = "rgba";
      m.size = 0.75;
      m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      m.shape = Potree.PointShape.CIRCLE;

      // Application de la palette après l'ajout au viewer
      m.classification = classification;
      m.recomputeClassification();
      viewer.setClassifications(classification);

      viewer.zoomTo(pc, 1, 0);
    });

    // 4. LiDAR HD (couleurs RVB)
    Potree.loadPointCloud("../pointclouds/lidar_hd_rvb/metadata.json", "LiDAR HD RVB", e => {
      const m = e.pointcloud.material;
      m.activeAttributeName = "rgba";
      m.size = 0.75;
      m.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      m.shape = Potree.PointShape.CIRCLE;

      viewer.scene.addPointCloud(e.pointcloud);
      e.pointcloud.visible = false;
    });

  </script>
</body>
</html>
